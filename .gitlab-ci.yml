stages:
  - test
  - build

unit-test:
  image: python:3.12-slim
  stage: test
  before_script:
    - python3 -m pip install --no-cache-dir -e ".[dev]"
  script:
    - python3 -m pytest -q

container-build:
  image: docker:27-cli
  stage: build
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - unit-test
  script:
    - docker build --pull -t "${CI_REGISTRY_IMAGE:-forgeloop}:${CI_COMMIT_SHA}" .
